<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>Gymly - Perfil</title>
    <link rel="stylesheet" href="../Css/componentes.css?v=app3">
    <link rel="stylesheet" href="../Css/phone.css?v=app3">
    <link rel="stylesheet" href="../Css/usuario.css?v=app3">
</head>
<body class="app">
<div class="phone">
<div class="phone-screen">

    <!-- CABECERA -->
    <header>
        <div class="header-izq">
            
            <h1>GYMLY</h1>
        </div>
        <button id="btnNotificaciones" type="button" aria-label="Notificaciones" title="Notificaciones">
            <img class="icono-notificaciones" src="../Img/icono-notificaciones.png" alt="">
        </button>
    </header>

    <!-- CONTENIDO -->
    <main>

        <!-- TÍTULO -->
        <section id="tituloPerfil" class="titulo-pagina">
            <p class="eyebrow">Mi cuenta</p>
            <h2>Perfil</h2>
        </section>

        <!-- TARJETA DE PERFIL -->
        <section class="perfil-cabecera">
            <div class="perfil-avatar" id="avatarUsuario" aria-hidden="true">G</div>
            <div class="perfil-nombre profile-name">Mi cuenta</div>
            <p class="perfil-email" id="emailCabecera"></p>
        </section>

        <!-- INFORMACIÓN DEL USUARIO -->
        <section id="informacionUsuario">
            <h2>Información personal</h2>

            <div class="datoPerfil">
                <p>Nombre</p>
                <span id="nombreUsuario">Usuario</span>
            </div>

            <div class="datoPerfil">
                <p>Apellido</p>
                <span id="apellidoUsuario">Apellido</span>
            </div>

            <div class="datoPerfil">
                <p>Email</p>
                <span id="emailUsuario">correo@ejemplo.com</span>
            </div>
        </section>

        <!-- EDITAR PERFIL -->
        <section id="editarPerfil">
            <h2>Editar perfil</h2>

            <form id="formPerfil">
                <div>
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" autocomplete="given-name">
                </div>

                <div>
                    <label for="apellido">Apellido</label>
                    <input type="text" id="apellido" autocomplete="family-name">
                </div>

                <button type="submit" id="btnGuardarPerfil">Guardar cambios</button>
            </form>
        </section>

        <!-- SESIÓN -->
        <section id="sesion">
            <button id="btnCerrarSesion" type="button">Cerrar sesión</button>
        </section>
    </main>

    <!-- NAVEGACIÓN -->
    <nav>
        <button id="navInicio" type="button">Inicio</button>
        <button id="navRutinas" type="button">Rutinas</button>
        <button id="navChat" type="button">Chat</button>
        <button id="navPerfil" type="button">Perfil</button>
    </nav>

</div>
</div>
    <script src="../Js/demo-api.js"></script>
    <script src="../Js/ui.js?v=app3"></script>
    <script src="../Js/usuario.js"></script>
</body>
</html>

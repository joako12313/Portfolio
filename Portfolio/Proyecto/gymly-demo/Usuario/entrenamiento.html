<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>Gymly - Entrenamiento</title>
    <link rel="stylesheet" href="../Css/componentes.css?v=app3">
    <link rel="stylesheet" href="../Css/phone.css?v=app3">
    <link rel="stylesheet" href="../Css/usuario.css?v=app3">
</head>
<body class="app">
<div class="phone">
<div class="phone-screen">

    <!-- CABECERA -->
    <header>
        <div class="header-izq">
            <button id="btnVolver" type="button" aria-label="Volver"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
            <h1>GYMLY</h1>
        </div>
        <button id="btnNotificaciones" type="button" aria-label="Notificaciones" title="Notificaciones">
            <img class="icono-notificaciones" src="../Img/icono-notificaciones.png" alt="">
        </button>
    </header>

    <!-- CONTENIDO -->
    <main>

        <section id="informacionRutina">
            <p class="eyebrow">Entrenamiento</p>
            <h2 id="nombreRutina">Rutina</h2>
            <p>Ejercicios: <span id="cantidadEjercicios">0</span></p>
            <p id="estadoEntrenamiento">Sesión sin comenzar</p>
            <div class="barra-progreso" aria-hidden="true"><span id="barraEntrenamiento"></span></div>
        </section>

        <section id="listaEjercicios">
            <h2>Ejercicios</h2>
            <div id="ejerciciosEntrenamiento"></div>
            <div id="sinEjerciciosEntrenamiento" class="estadoVacio" style="display:none">
                <h3>Esta rutina no tiene ejercicios</h3>
                <p>Volvé a rutinas para seleccionar otra.</p>
            </div>
        </section>

        <section id="finalizarEntrenamiento">
            <button id="btnFinalizar" type="button">Finalizar entrenamiento</button>
        </section>
    </main>

    <!-- NAVEGACIÓN -->
    <nav>
        <button id="navInicio" type="button">Inicio</button>
        <button id="navRutinas" type="button">Rutinas</button>
        <button id="navChat" type="button">Chat</button>
        <button id="navPerfil" type="button">Perfil</button>
    </nav>

</div>
</div>
    <script src="../Js/demo-api.js"></script>
    <script src="../Js/ui.js?v=app3"></script>
    <script src="../Js/media-ejercicio.js"></script>
    <script src="../Js/entrenamiento.js"></script>
    <script src="../Js/usuario.js"></script>
</body>
</html>

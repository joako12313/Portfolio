<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>Gymly - Mi mensualidad</title>
    <link rel="stylesheet" href="../Css/componentes.css?v=app3">
    <link rel="stylesheet" href="../Css/phone.css?v=app3">
    <link rel="stylesheet" href="../Css/usuario.css?v=app3">
</head>
<body class="app">
<div class="phone">
<div class="phone-screen">

    <!-- CABECERA -->
    <header>
        <div class="header-izq">
            <button id="btnVolver" type="button" aria-label="Volver"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
            <h1>GYMLY</h1>
        </div>
        <button id="btnNotificaciones" type="button" aria-label="Notificaciones" title="Notificaciones">
            <img class="icono-notificaciones" src="../Img/icono-notificaciones.png" alt="">
        </button>
    </header>

    <!-- CONTENIDO -->
    <main>

        <section id="tituloMensualidad" class="titulo-pagina">
            <p class="eyebrow">Cuenta</p>
            <h2>Mi mensualidad</h2>
            <p class="desc">El pago se realiza presencialmente en el gimnasio.</p>
        </section>

        <section class="estado-cuota" aria-live="polite" aria-atomic="true">
            <p class="eyebrow">Estado</p>
            <h3 id="estadoCuota">Consultando...</h3>
            <p id="detalleCuota"></p>
            <p id="fechaCuota"></p>
        </section>
        <p id="errorCuota" role="alert"></p>
    </main>

    <!-- NAVEGACIÓN -->
    <nav>
        <button id="navInicio" type="button">Inicio</button>
        <button id="navRutinas" type="button">Rutinas</button>
        <button id="navChat" type="button">Chat</button>
        <button id="navPerfil" type="button">Perfil</button>
    </nav>

</div>
</div>
    <script src="../Js/demo-api.js"></script>
    <script src="../Js/ui.js?v=app3"></script>
    <script src="../Js/pagos.js"></script>
    <script src="../Js/usuario.js"></script>
</body>
</html>

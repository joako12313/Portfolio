<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>Gymly - Chat</title>
    <link rel="stylesheet" href="../Css/componentes.css?v=app3">
    <link rel="stylesheet" href="../Css/phone.css?v=app3">
    <link rel="stylesheet" href="../Css/usuario.css?v=app3">
</head>
<body class="app">
<div class="phone">
<div class="phone-screen">

    <!-- CABECERA -->
    <header>
        <div class="header-izq">
            
            <h1>GYMLY</h1>
        </div>
        <button id="btnNotificaciones" type="button" aria-label="Notificaciones" title="Notificaciones">
            <img class="icono-notificaciones" src="../Img/icono-notificaciones.png" alt="">
        </button>
    </header>

    <!-- CONTENIDO -->
    <main class="pagina-chat">

        <!-- INFORMACIÓN DEL CHAT -->
        <section id="informacionChat">
            <p class="eyebrow">Comunicación</p>
            <h2>Chat con administrador</h2>
            <p>Podés comunicarte directamente con el administrador.</p>
        </section>

        <!-- MENSAJES -->
        <section id="mensajes" class="chat-lista">
            <div id="listaMensajes"></div>
        </section>
        <p id="estadoChat" role="status" aria-live="polite"></p>

        <!-- ESCRIBIR MENSAJE -->
        <section id="enviarMensaje">
            <form id="formChat">
                <input type="text" id="mensaje" maxlength="2000" placeholder="Escribí un mensaje..." autocomplete="off">
                <button type="submit" id="btnEnviar">Enviar</button>
            </form>
        </section>
    </main>

    <!-- NAVEGACIÓN -->
    <nav>
        <button id="navInicio" type="button">Inicio</button>
        <button id="navRutinas" type="button">Rutinas</button>
        <button id="navChat" type="button">Chat</button>
        <button id="navPerfil" type="button">Perfil</button>
    </nav>

</div>
</div>
    <script src="../Js/demo-api.js"></script>
    <script src="../Js/ui.js?v=app3"></script>
    <script src="../Js/mensajes.js"></script>
    <script src="../Js/usuario.js"></script>
</body>
</html>

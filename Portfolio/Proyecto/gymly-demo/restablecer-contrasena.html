<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>Gymly - Restablecer contraseña</title>
    <link rel="stylesheet" href="Css/componentes.css?v=app3">
    <link rel="stylesheet" href="Css/phone.css?v=app3">
    <link rel="stylesheet" href="Css/auth.css?v=app3">
</head>
<body class="app">
<div class="phone">
<div class="phone-screen auth">
    <main class="auth-contenido">
        <header class="brand">
            <div class="logo-caja">
                    <svg viewBox="0 0 68 68" role="img" aria-label="Gymly">
                        <line x1="14" y1="52" x2="22" y2="16" stroke="#F2B400" stroke-width="8" stroke-linecap="round"/>
                        <line x1="34" y1="52" x2="42" y2="16" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
                        <line x1="54" y1="52" x2="62" y2="16" stroke="#CFAA7E" stroke-width="8" stroke-linecap="round"/>
                    </svg>
                </div>
            <h1>Crear una nueva contraseña</h1>
            <p>El enlace es válido durante 30 minutos y solo se puede usar una vez.</p>
        </header>

        <form id="resetForm" class="form" hidden>
            <div class="field">
                <label for="newPassword">Nueva contraseña</label>
                <div class="password">
                    <input type="password" id="newPassword" placeholder="Mínimo 8 caracteres" autocomplete="new-password" minlength="8" maxlength="128" required>
                    <button type="button" class="toggle" data-for="newPassword" aria-label="Mostrar contraseña" aria-pressed="false"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
                </div>
            </div>
            <div class="field">
                <label for="confirmPassword">Repetir nueva contraseña</label>
                <div class="password">
                    <input type="password" id="confirmPassword" placeholder="Repetí la contraseña" autocomplete="new-password" minlength="8" maxlength="128" required>
                    <button type="button" class="toggle" data-for="confirmPassword" aria-label="Mostrar contraseña" aria-pressed="false"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
                </div>
            </div>
            <button type="submit" class="submit">Guardar contraseña</button>
        </form>

        <p id="resetMessage" role="status" hidden></p>

        <div class="auth-pie">
            <a class="link-volver" href="index.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>Volver al inicio de sesión</a>
        </div>
    </main>
</div>
</div>
    <script src="Js/demo-api.js"></script>
    <script src="Js/ui.js?v=app3"></script>
    <script src="Js/password-toggle.js"></script>
    <script src="Js/restablecer-contrasena.js"></script>
</body>
</html>

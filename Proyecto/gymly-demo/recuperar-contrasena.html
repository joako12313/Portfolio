<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>Gymly - Recuperar contraseña</title>
    <link rel="stylesheet" href="Css/componentes.css?v=app3">
    <link rel="stylesheet" href="Css/phone.css?v=app3">
    <link rel="stylesheet" href="Css/auth.css?v=app3">
</head>
<body class="app">
<div class="phone">
<div class="phone-screen auth">
    <main class="auth-contenido">
        <header class="brand">
            <div class="logo-caja">
                    <svg viewBox="0 0 68 68" role="img" aria-label="Gymly">
                        <line x1="14" y1="52" x2="22" y2="16" stroke="#F2B400" stroke-width="8" stroke-linecap="round"/>
                        <line x1="34" y1="52" x2="42" y2="16" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
                        <line x1="54" y1="52" x2="62" y2="16" stroke="#CFAA7E" stroke-width="8" stroke-linecap="round"/>
                    </svg>
                </div>
            <h1>Recuperar contraseña</h1>
            <p>Ingresá el correo de tu cuenta y te enviaremos un enlace para crear una nueva contraseña.</p>
        </header>

        <form id="recoveryForm" class="form">
            <div class="field">
                <label for="recoveryEmail">Correo electrónico</label>
                <input type="email" id="recoveryEmail" name="email" placeholder="nombre@gimnasio.com" autocomplete="email" required>
            </div>
            <button type="submit" class="submit">Enviar enlace</button>
        </form>

        <p id="recoveryMessage" role="status" hidden></p>

        <div class="auth-pie">
            <a class="link-volver" href="index.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>Volver a iniciar sesión</a>
        </div>
    </main>
</div>
</div>
    <script src="Js/demo-api.js"></script>
    <script src="Js/ui.js?v=app3"></script>
    <script src="Js/recuperar-contrasena.js"></script>
</body>
</html>

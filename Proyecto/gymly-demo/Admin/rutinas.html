<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gymly - Rutinas</title>
    <link rel="stylesheet" href="../Css/componentes.css?v=app3">
    <link rel="stylesheet" href="../Css/admin.css?v=app3">
    <link rel="stylesheet" href="../Css/admin-rutinas.css?v=app3">
</head>
<body class="admin">
<div class="admin-app">
    <aside class="sidebar">
        <a class="logo" href="dashboard.html" aria-label="Ir al inicio">GYMLY<small>Administrador</small></a>
        <nav class="side-nav" aria-label="Secciones">
            <a class="side-link" href="dashboard.html"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.500" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.500" width="7.5" height="7.5" rx="2"/><rect x="13.500" y="13.500" width="7.5" height="7.5" rx="2"/></svg><span>Panel</span></a>
            <a class="side-link" href="usuarios.html"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.500 20a6.500 6.500 0 0 1 13 0"/><path d="M16 4.500a3.500 3.500 0 0 1 0 7"/><path d="M18 14.500a6.500 6.500 0 0 1 3.500 5.500"/></svg><span>Usuarios</span></a>
            <a class="side-link" href="gimnasio.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.500C5 14.800 12 21 12 21Z"/><circle cx="12" cy="9.500" r="2.500"/></svg><span>Gimnasio y horarios</span></a>
            <a class="side-link active" href="rutinas.html" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 18V9"/><path d="M19 18V9"/><path d="M8 18V6.500A2.500 2.500 0 0 1 10.500 4h3A2.500 2.500 0 0 1 16 6.500V18"/><path d="M3 18h18"/></svg><span>Rutinas</span></a>
            <a class="side-link" href="ejercicios.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.500 6.500v11"/><path d="M17.500 6.500v11"/><path d="M3.500 9v6"/><path d="M20.500 9v6"/><path d="M6.500 12h11"/></svg><span>Ejercicios</span></a>
            <a class="side-link" href="entrenadores.html"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="8" r="3.500"/><path d="M3 20a7 7 0 0 1 14 0"/><path d="m16.500 11.500 2 2 3.500-4"/></svg><span>Entrenadores</span></a>
            <a class="side-link" href="pagos.html"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.500"/><path d="M3 10h18"/><path d="M7 15h4"/></svg><span>Pagos</span></a>
            <a class="side-link" href="reportes.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V5"/><path d="M4 19h16"/><path d="m8 15 3-4 3 2 4-6"/></svg><span>Reportes</span></a>
            <a class="side-link" href="mensajes.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 18.500V6.500A2.500 2.500 0 0 1 7.500 4h9A2.500 2.500 0 0 1 19 6.500v8a2.500 2.500 0 0 1-2.500 2.500H9l-4 3.500Z"/><path d="M8 9h8"/><path d="M8 12h6"/></svg><span>Mensajes</span></a>
        </nav>
        <div class="side-pie">
            <div class="side-user">
                <div class="side-avatar" id="sideAvatar" aria-hidden="true">G</div>
                <div class="side-user-datos">
                    <span class="side-user-nombre" id="sideNombre">Administrador</span>
                    <span class="side-user-rol">Administrador</span>
                </div>
            </div>
            <button id="btnCerrarSesion" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg><span>Cerrar sesión</span></button>
        </div>
    </aside>

    <div class="admin-main">
        <header class="topbar">
            <div class="migas">Administrador / <b>Rutinas</b></div>
            <div class="admin-info"><span>Administrador</span></div>
        </header>

        <main class="contenedor">
            <section class="titulo-seccion">
                <div>
                    <h1>Rutinas</h1>
                    <p>Crear y administrar rutinas de los usuarios.</p>
                </div>
                <button id="btnNuevaRutina" class="btn-agregar" type="button">+ Nueva rutina</button>
            </section>
            <section class="barra-busqueda">
                <input id="buscarRutina" type="search" placeholder="Buscar rutina o usuario" autocomplete="off">
            </section>
            <section class="panelRutinas panel-rutinas-admin">
                <div id="listaRutinasAdmin"></div>
                <p id="sinRutinasAdmin" class="estadoVacio">No hay rutinas cargadas.</p>
            </section>
        </main>
    </div>
</div>

    <div id="modalRutina" class="modalRutina" style="display:none">
        <div class="modalContenido">
            <h3 id="tituloModalRutina">Nueva rutina</h3>
            <label>Usuario
                <select id="rutinaUsuario" required>
                    <option value="">Seleccionar usuario</option>
                </select>
            </label>
            <label>Entrenador (opcional)
                <select id="rutinaEntrenador">
                    <option value="">Sin asignar</option>
                </select>
            </label>
            <label>Nombre<input id="rutinaNombre" type="text" placeholder="Ej: Rutina de fuerza" required></label>
            <label>Objetivo<input id="rutinaObjetivo" type="text" placeholder="Ej: Fuerza"></label>
            <label>Descripción<textarea id="rutinaDescripcion" placeholder="Descripción de la rutina"></textarea></label>
            <label>Día de entrenamiento
                <select id="rutinaDiaSemana">
                    <option value="">Sin asignar</option>
                    <option value="lunes">Lunes</option>
                    <option value="martes">Martes</option>
                    <option value="miercoles">Miércoles</option>
                    <option value="jueves">Jueves</option>
                    <option value="viernes">Viernes</option>
                    <option value="sabado">Sábado</option>
                    <option value="domingo">Domingo</option>
                </select>
            </label>
            <label>Estado
                <select id="rutinaActiva">
                    <option value="1">Activa</option>
                    <option value="0">Inactiva</option>
                </select>
            </label>
            <div>
                <button id="btnGuardarRutina" type="button">Guardar</button>
                <button id="btnCancelarRutina" type="button">Cancelar</button>
            </div>
        </div>
    </div>

    <div id="modalEjercicios" class="modalRutina" style="display:none">
        <div class="modalContenido">
            <h3 id="tituloEjerciciosRutina">Ejercicios de la rutina</h3>
            <div id="listaEjerciciosRutina"></div>
            <div id="agregarEjercicioForm">
                <hr>
                <label>Ejercicio
                    <select id="selectEjercicio">
                        <option value="">Seleccionar ejercicio</option>
                    </select>
                </label>
                <label>Series<input id="ejercicioSeries" type="number" min="1" value="3"></label>
                <label>Repeticiones<input id="ejercicioReps" type="number" min="1" value="10"></label>
                <label>Peso (kg)<input id="ejercicioPeso" type="number" min="0" step="0.5" value="0"></label>
                <button id="btnAgregarEjercicio" type="button">Agregar ejercicio</button>
            </div>
            <div>
                <button id="btnCerrarEjercicios" type="button">Cerrar</button>
            </div>
        </div>
    </div>

    <script src="../Js/demo-api.js"></script>
    <script src="../Js/ui.js?v=app3"></script>
    <script src="../Js/admin-shell.js?v=app3"></script>
    <script src="../Js/media-ejercicio.js"></script>
    <script src="../Js/rutinas.js?v=all-routines"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gymly - Rutinas para usuarios</title>
    <link rel="stylesheet" href="../Css/componentes.css?v=app3">
    <link rel="stylesheet" href="../Css/admin.css?v=app3">
    <link rel="stylesheet" href="../Css/admin-rutinas.css?v=app3">
</head>
<body class="admin">
<div class="admin-app">
    <aside class="sidebar">
        <a class="logo" href="../Usuario/inicio.html" aria-label="Ir al inicio">GYMLY<small>Entrenador</small></a>
        <nav class="side-nav" aria-label="Secciones">
            <a class="side-link active" href="rutinas.html" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 18V9"/><path d="M19 18V9"/><path d="M8 18V6.500A2.500 2.500 0 0 1 10.500 4h3A2.500 2.500 0 0 1 16 6.500V18"/><path d="M3 18h18"/></svg><span>Rutinas</span></a>
            <a class="side-link" href="../Usuario/inicio.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.500 12 3l9 7.500"/><path d="M5 9.500V20h14V9.500"/><path d="M9 20v-7h6v7"/></svg><span>Volver al inicio</span></a>
        </nav>
        <div class="side-pie">
            <div class="side-user">
                <div class="side-avatar" id="sideAvatar" aria-hidden="true">G</div>
                <div class="side-user-datos">
                    <span class="side-user-nombre" id="sideNombre">Entrenador</span>
                    <span class="side-user-rol">Entrenador</span>
                </div>
            </div>
            <button id="btnCerrarSesion" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg><span>Cerrar sesión</span></button>
        </div>
    </aside>

    <div class="admin-main">
        <header class="topbar">
            <div class="migas">Entrenador / <b>Rutinas</b></div>
            <div class="admin-info"><span>Entrenador</span></div>
        </header>

        <main class="contenedor">
            <section class="titulo-seccion">
                <div>
                    <h1>Rutinas para usuarios</h1>
                    <p>Creá y asigná planes de entrenamiento a los usuarios del gimnasio.</p>
                </div>
                <button id="btnNuevaRutina" class="btn-agregar" type="button">+ Asignar rutina</button>
            </section>
            <section class="barra-busqueda">
                <input id="buscarRutina" type="search" placeholder="Buscar rutina o usuario" autocomplete="off">
            </section>
            <section class="panelRutinas panel-rutinas-admin">
                <div id="listaRutinasAdmin"></div>
                <p id="sinRutinasAdmin" class="estadoVacio">Todavía no asignaste rutinas.</p>
            </section>
        </main>
    </div>
</div>

    <div id="modalRutina" class="modalRutina" style="display:none">
        <div class="modalContenido">
            <h3 id="tituloModalRutina">Nueva rutina</h3>
            <label>Usuario
                <select id="rutinaUsuario" required>
                    <option value="">Seleccionar usuario</option>
                </select>
            </label>
            <label>Nombre<input id="rutinaNombre" type="text" placeholder="Ej: Rutina de fuerza" required></label>
            <label>Objetivo<input id="rutinaObjetivo" type="text" placeholder="Ej: Fuerza"></label>
            <label>Descripción<textarea id="rutinaDescripcion" placeholder="Descripción de la rutina"></textarea></label>
            <label>Día de entrenamiento
                <select id="rutinaDiaSemana">
                    <option value="">Sin asignar</option>
                    <option value="lunes">Lunes</option>
                    <option value="martes">Martes</option>
                    <option value="miercoles">Miércoles</option>
                    <option value="jueves">Jueves</option>
                    <option value="viernes">Viernes</option>
                    <option value="sabado">Sábado</option>
                    <option value="domingo">Domingo</option>
                </select>
            </label>
            <label>Estado
                <select id="rutinaActiva">
                    <option value="1">Activa</option>
                    <option value="0">Inactiva</option>
                </select>
            </label>
            <div>
                <button id="btnGuardarRutina" type="button">Guardar</button>
                <button id="btnCancelarRutina" type="button">Cancelar</button>
            </div>
        </div>
    </div>

    <div id="modalEjercicios" class="modalRutina" style="display:none">
        <div class="modalContenido">
            <h3 id="tituloEjerciciosRutina">Ejercicios de la rutina</h3>
            <div id="listaEjerciciosRutina"></div>
            <div id="agregarEjercicioForm">
                <hr>
                <label>Ejercicio
                    <select id="selectEjercicio">
                        <option value="">Seleccionar ejercicio</option>
                    </select>
                </label>
                <label>Series<input id="ejercicioSeries" type="number" min="1" value="3"></label>
                <label>Repeticiones<input id="ejercicioReps" type="number" min="1" value="10"></label>
                <label>Peso (kg)<input id="ejercicioPeso" type="number" min="0" step="0.5" value="0"></label>
                <button id="btnAgregarEjercicio" type="button">Agregar ejercicio</button>
            </div>
            <div>
                <button id="btnCerrarEjercicios" type="button">Cerrar</button>
            </div>
        </div>
    </div>

    <script src="../Js/demo-api.js"></script>
    <script src="../Js/ui.js?v=app3"></script>
    <script src="../Js/admin-shell.js?v=app3"></script>
    <script src="../Js/media-ejercicio.js"></script>
    <script src="../Js/rutinas.js?v=all-routines"></script>
</body>
</html>
